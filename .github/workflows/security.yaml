name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # weekly full scan so newly disclosed vulnerabilities surface even when the repo is idle
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # diff-aware scan: fails a PR only if it introduces new vulnerable dependencies
  osv-scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=./package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  # full scan of the lockfile on main and on the weekly schedule
  osv-scan:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=./package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  # npm's own advisory database as a second opinion; production deps only
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
